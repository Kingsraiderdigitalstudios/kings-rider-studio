<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kings Rider - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght=300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .serif-title { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-800 dark:text-zinc-200 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div class="w-full max-w-md bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-8 shadow-xl rounded-sm transition-colors duration-300">
        
        <div class="text-center mb-8">
            <div class="text-xs uppercase tracking-widest font-bold text-emerald-500 mb-2 flex items-center justify-center gap-2">
                <span class="w-2 h-2 bg-emerald-500 rounded-full inline-block animate-pulse"></span> Protected Area
            </div>
            <h1 class="serif-title text-3xl font-normal text-zinc-900 dark:text-white">Studio Gate</h1>
            <p class="text-zinc-400 dark:text-zinc-500 text-[10px] uppercase tracking-wider mt-1">Sign in to manage Kings Rider Digital Studios</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-[9px] font-bold uppercase tracking-widest text-zinc-400 dark:text-zinc-500 mb-2">Admin Email</label>
                <input type="email" id="login-email" required placeholder="admin@kingsrider.com" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-4 py-3 text-xs text-zinc-800 dark:text-zinc-200 focus:outline-none focus:border-emerald-500 transition-colors rounded-none">
            </div>
            <div>
                <label class="block text-[9px] font-bold uppercase tracking-widest text-zinc-400 dark:text-zinc-500 mb-2">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 px-4 py-3 text-xs text-zinc-800 dark:text-zinc-200 focus:outline-none focus:border-emerald-500 transition-colors rounded-none">
            </div>
            
            <div id="error-message" class="text-rose-500 text-[11px] font-medium p-3 bg-rose-50 dark:bg-rose-950/20 border border-rose-200 dark:border-rose-900/30 hidden rounded-none tracking-wide"></div>

            <button type="submit" class="w-full bg-zinc-900 text-white dark:bg-emerald-500 font-semibold py-3.5 text-xs uppercase tracking-widest hover:bg-emerald-600 dark:hover:bg-emerald-600 transition-all rounded-none shadow-md">
                Verify Identity
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="index.html" class="text-[10px] uppercase tracking-widest text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors">&larr; Return Public Site</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDX354S0hE-9l5_5zWNC3vYXh3YbpEUL9k",
            authDomain: "kings-raider-digital-studios.firebaseapp.com",
            projectId: "kings-raider-digital-studios",
            storageBucket: "kings-raider-digital-studios.firebasestorage.app",
            messagingSenderId: "154961726497",
            appId: "1:154961726497:web:d894cade5ba0cb7b00e760"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        const loginForm = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');

            const email = document.getElementById('login-email').value.trim(); // Added trim to auto-remove accidental whitespace
            const password = document.getElementById('login-password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "admin.html"; 
            } catch (error) {
                console.error("Firebase Auth Error Object:", error);
                
                // Formats the error code text cleanly (e.g., "auth/invalid-credential" -> "Invalid Credential")
                let cleanMessage = error.code 
                    ? error.code.replace('auth/', '').replace(/-/g, ' ')
                    : error.message;
                
                errorDiv.innerHTML = `<strong>Login Failed:</strong> <span class="capitalize">${cleanMessage}</span>.<br><span class="text-[10px] opacity-80 font-normal">Check your Firebase user console settings.</span>`;
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
