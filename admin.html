<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kings Rider Digital Studios - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .serif-title { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 antialiased min-h-screen flex flex-col">

    <!-- NAVIGATION BAR -->
    <nav class="border-b border-zinc-900 bg-zinc-900/50 backdrop-blur-md sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 bg-emerald-500 rounded-full"></div>
                <h1 class="serif-title text-xl font-normal tracking-wide text-white">Kings Rider Control</h1>
            </div>
            <div class="flex items-center gap-6">
                <a href="index.html" class="text-xs uppercase tracking-widest text-zinc-400 hover:text-white transition-colors">View Live Portfolio</a>
                <button id="logout-btn" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-[10px] font-bold uppercase tracking-widest px-4 py-2 transition-colors">
                    Sign Out
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN INTERFACE MAIN BODY -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-6 md:p-10 space-y-10">
        
        <!-- WELCOME CARD -->
        <div>
            <h2 class="serif-title text-3xl font-normal text-white mb-1">Studio Dashboard</h2>
            <p class="text-zinc-500 text-xs">Upload new photography work to your cloud gallery files instantly.</p>
        </div>

        <!-- PHOTO UPLOAD CONTROL PANEL -->
        <div class="bg-zinc-900 border border-zinc-800 p-6 md:p-8 shadow-2xl relative">
            <h3 class="serif-title text-xl text-white mb-6 flex items-center gap-2">
                Upload New Studio Work
            </h3>
            
            <form id="upload-form" class="space-y-6">
                <!-- File Picker Input Box -->
                <div>
                    <label class="block text-[10px] uppercase tracking-widest font-semibold text-zinc-400 mb-2.5">Select Image File</label>
                    <input type="file" id="photo-file" accept="image/*" required
                        class="w-full bg-zinc-950 border border-zinc-800 text-sm p-3 text-zinc-400 focus:outline-none focus:border-emerald-500 file:mr-4 file:py-2 file:px-4 file:border-0 file:text-xs file:font-bold file:uppercase file:tracking-wider file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700 file:transition-colors cursor-pointer">
                </div>
                
                <!-- Feedback Status Message Window -->
                <div id="upload-status" class="hidden border p-4">
                    <p id="status-text" class="text-xs font-semibold"></p>
                </div>
                
                <!-- Submission Upload Trigger Button -->
                <button type="submit" id="upload-btn" 
                    class="bg-emerald-500 hover:bg-emerald-600 disabled:bg-zinc-800 disabled:text-zinc-500 text-zinc-950 font-bold uppercase tracking-widest text-xs px-8 py-4 transition-all shadow-lg cursor-pointer">
                    Upload Photo
                </button>
            </form>
        </div>
    </main>

    <!-- FOOTER TRACKER -->
    <footer class="border-t border-zinc-900/60 py-6 text-center text-[10px] text-zinc-600 uppercase tracking-widest">
        Kings Rider Digital Studios &copy; 2026 Dashboard Portal
    </footer>

    <!-- CLOUD ARCHITECTURE HANDSHAKE SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Verified Configuration from your dashboard
        const firebaseConfig = {
            apiKey: "AIzaSyDX354S0hE-9l5_5zWNC3vYXh3YbpEUL9k",
            authDomain: "kings-raider-digital-studios.firebaseapp.com",
            projectId: "kings-raider-digital-studios",
            storageBucket: "kings-raider-digital-studios.firebasestorage.app",
            messagingSenderId: "154961726497",
            appId: "1:154961726497:web:d894cade5ba0cb7b00e760"
        };

        // Initialize Services
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const db = getFirestore(app);

        const uploadForm = document.getElementById('upload-form');
        const uploadBtn = document.getElementById('upload-btn');
        const uploadStatus = document.getElementById('upload-status');
        const statusText = document.getElementById('status-text');
        const logoutBtn = document.getElementById('logout-btn');

        // SECURITY CHECK: Protect page from unauthenticated users
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // No user found signed in, throw them back to login gate
                window.location.href = "login.html";
            }
        });

        // HANDLE IMAGE UPLOAD SUBMISSION EVENT
        if (uploadForm) {
            uploadForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const fileInput = document.getElementById('photo-file');
                const file = fileInput.files[0];
                if (!file) return;

                // Lock down UI inputs and show status updates
                uploadBtn.disabled = true;
                uploadBtn.innerText = "Uploading to Cloud...";
                
                uploadStatus.className = "bg-amber-950/40 border-amber-900/60 p-4 block text-amber-400";
                statusText.innerText = "Connecting to storage bucket and transmitting file...";

                try {
                    // 1. Send binary image package straight to Firebase Storage folder
                    const uniqueFileName = `${Date.now()}_${file.name}`;
                    const storageRef = ref(storage, `portfolio/${uniqueFileName}`);
                    const snapshot = await uploadBytes(storageRef, file);
                    
                    // 2. Fetch the newly created live internet image web link
                    const downloadURL = await getDownloadURL(snapshot.ref);

                    // 3. Register image link entry into Firestore "photos" database collection
                    await addDoc(collection(db, "photos"), {
                        url: downloadURL,
                        name: file.name,
                        uploadedAt: new Date()
                    });

                    // Trigger UI success interface clean up state updates
                    uploadStatus.className = "bg-emerald-950/40 border-emerald-900/60 p-4 block text-emerald-400";
                    statusText.innerText = `Success! "${file.name}" is now live on your portfolio gallery.`;
                    uploadForm.reset();
                } catch (error) {
                    console.error("Upload execution process error log:", error);
                    uploadStatus.className = "bg-rose-950/40 border-rose-900/60 p-4 block text-rose-400";
                    statusText.innerText = `Upload Failed: ${error.message}`;
                } finally {
                    uploadBtn.disabled = false;
                    uploadBtn.innerText = "Upload Photo";
                }
            });
        }

        // HANDLE DISCONNECT LOGOUT ACTIONS
        if (logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
                try {
                    await signOut(auth);
                    window.location.href = "login.html";
                } catch (error) {
                    alert("Error signing out: " + error.message);
                }
            });
        }
    </script>
</body>
</html>
